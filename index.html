<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Piger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600&family=Inter&family=JetBrains+Mono&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <button id="saved-button" class="pill" aria-label="Saved phrases">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
          <span id="saved-count">0/5</span>
        </button>
        <button id="streak-button" class="pill" aria-label="Current streak">
          🔥
          <span id="streak-count">0</span>
        </button>
      </div>
      <span class="wordmark">piger</span>
    </header>

    <main id="feed"></main>

    <div id="sheet-backdrop" class="sheet-backdrop"></div>
    <aside id="saved-sheet" class="sheet" aria-hidden="true">
      <div class="sheet-handle"></div>
      <header class="sheet-header">
        <h2 class="sheet-title">Saved</h2>
        <button id="sheet-close" class="sheet-close" aria-label="Close saved list">&times;</button>
      </header>
      <div id="saved-list" class="sheet-list"></div>
    </aside>

    <script src="phrases.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
